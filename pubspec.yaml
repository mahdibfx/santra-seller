name: santra_seller
description: Santra Sellers — seller app (clean Stacked MVVM rebuild).
publish_to: 'none'
version: 5.2.0+39

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Architecture
  stacked: ^3.5.0
  stacked_services: ^1.6.0
  stacked_hooks: ^0.2.4
  flutter_hooks: ^0.20.5

  # Networking + functional error handling
  dio: ^5.7.0
  fpdart: ^1.1.0

  # Theming / fonts / i18n
  google_fonts: ^6.2.1
  easy_localization: ^3.0.7
  intl: ^0.20.2

  # Persistence
  shared_preferences: ^2.3.4

  # External links
  url_launcher: ^6.3.2

  # Media
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.1
  package_info_plus: ^10.2.2
  app_tracking_transparency: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  stacked_generator: ^2.0.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - assets/splash/
    - assets/icons/

# Native splash: brand purple with the white mark, until Flutter draws its
# first frame. Regenerate after changing anything here:
#   dart run flutter_native_splash:create
# The Flutter splash (lib/ui/views/welcome/splash_mark.dart) draws the same
# mark at the same size on the same colour, so the hand-off is invisible and
# the animation starts from exactly where the native splash left off.
flutter_native_splash:
  web: false
  color: "#7E2A83"
  image: assets/splash/splash.png
  android_12:
    color: "#7E2A83"
    image: assets/splash/android12.png
