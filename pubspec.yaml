name: santra_seller
description: A new Flutter project.
publish_to: 'none'
version: 3.3.4+1

environment:
  sdk: '>=2.18.2 <3.0.0'
dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.3
  badges: ^2.0.3
  shared_preferences: ^2.0.15
  dio: ^4.0.6
  intl: ^0.17.0
  cupertino_icons: ^1.0.2
  get: ^4.6.5
  flutter_rating_bar: ^4.0.1
  flutter_svg: ^1.1.4
  otp_text_field: ^1.1.3
  flutter_otp_text_field: ^1.1.1
  flutter_switch: ^0.3.2
  syncfusion_flutter_sliders: ^20.2.48
  image_picker: ^0.8.5+3
  http: ^0.13.5
  url_launcher: ^6.1.5
  webview_flutter: ^3.0.4
  mask_text_input_formatter: ^2.4.0
  range_slider_flutter: ^0.0.2
  modal_progress_hud_nsn: ^0.3.0
  firebase_core: ^2.1.0
  flutter_local_notifications: ^12.0.2
  firebase_messaging: ^14.0.2
  firebase_auth: ^4.0.2
  google_sign_in: ^5.4.2
  sign_in_with_apple: ^4.1.0
  toast: ^0.3.0
  google_maps_flutter: ^2.2.1
  geocoding: ^2.0.5
  geolocator: ^9.0.2
  package_info_plus: ^1.0.6
  cached_network_image: ^3.2.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  change_app_package_name: ^1.1.0
  flutter_lints: ^2.0.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/images/splash_full_svg.svg
  fonts:
    - family: Markpro
      fonts:
        - asset: assets/fonts/markpro.ttf
        - asset: assets/fonts/markprobold.ttf
          weight: 700
    - family: Activ
      fonts:
        - asset: assets/fonts/AktivGrotesk-Bold.ttf
        - asset: assets/fonts/AktivGrotesk-Medium.ttf
        - asset: assets/fonts/AktivGrotesk-Regular.ttf
          weight: 700
