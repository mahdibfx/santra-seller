name: santra_seller
description: Santra Sellers — seller app (clean Stacked MVVM rebuild).
publish_to: 'none'
version: 5.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Architecture
  stacked: ^3.5.0
  stacked_services: ^1.6.0
  stacked_hooks: ^0.2.4
  flutter_hooks: ^0.20.5

  # Networking + functional error handling
  dio: ^5.7.0
  fpdart: ^1.1.0

  # Theming / fonts / i18n
  google_fonts: ^6.2.1
  easy_localization: ^3.0.7
  intl: ^0.20.2

  # Media
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  stacked_generator: ^2.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/
