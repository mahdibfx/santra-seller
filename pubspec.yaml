name: santra_seller
description: A new Flutter project.
publish_to: 'none'
version: 4.4.0+2

environment:
  sdk: '>=2.18.2 <3.0.0'
dependencies:
  app_tracking_transparency: ^2.0.4
  appsflyer_sdk: ^6.10.3
  cached_network_image: ^3.3.0
  calendar_date_picker2: ^0.5.2
  cupertino_icons: ^1.0.2
  date_picker_timeline: ^1.2.3
  dropdown_search: ^5.0.6
  envify: null
  firebase_analytics: ^10.4.1
  firebase_auth: ^4.6.1
  firebase_core: ^2.13.0
  firebase_messaging: ^14.6.1
  flutter:
    sdk: flutter
  flutter_app_badger: ^1.5.0
  flutter_local_notifications: ^14.1.0
  flutter_markdown: ^0.6.17
  flutter_rating_bar: ^4.0.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.6
  flutter_switch: ^0.3.2
  fluttertoast: ^8.2.8
  get: ^4.6.6
  get_storage: ^2.1.1
  http: null
  image_picker: ^0.8.7+5
  intl: ^0.19.0
  mask_text_input_formatter: ^2.4.0
  mobile_scanner: ^5.2.1
  modal_progress_hud_nsn: ^0.4.0
  package_info_plus: ^4.0.0
  percent_indicator: ^4.2.3
  permission_handler: ^11.3.1
  provider: ^6.0.5
  share_plus: ^10.0.2
  shared_preferences: ^2.1.1
  table_calendar: ^3.1.1
  toast: ^0.3.0
  url_launcher: ^6.1.11
  win32: ^5.5.4

# dependency_overrides:
#  package_info_plus: ^4.0.1
dev_dependencies:
  change_app_package_name: ^1.1.0
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
  fonts:
    - family: Markpro
      fonts:
        - asset: assets/fonts/markpro.ttf
        - asset: assets/fonts/markprobold.ttf
        - asset: assets/fonts/MarkPro-Medium.ttf
          weight: 700
    - family: Activ
      fonts:
        - asset: assets/fonts/AktivGrotesk-Bold.ttf
        - asset: assets/fonts/AktivGrotesk-Medium.ttf
        - asset: assets/fonts/AktivGrotesk-Regular.ttf
          weight: 700
